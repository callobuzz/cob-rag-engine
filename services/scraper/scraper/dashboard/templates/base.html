<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Callobuzz Scraper{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <style>
        .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.8em; font-weight: bold; }
        .badge-verified { background: #d4edda; color: #155724; }
        .badge-flagged { background: #fff3cd; color: #856404; }
        .badge-failed { background: #f8d7da; color: #721c24; }
        .badge-delivered { background: #cce5ff; color: #004085; }
        .badge-approved { background: #d1ecf1; color: #0c5460; }
        .badge-crawling { background: #e2e3e5; color: #383d41; }
        .badge-pending { background: #e2e3e5; color: #383d41; }
        .badge-reviewing { background: #fff3cd; color: #856404; }
        .badge-done { background: #d4edda; color: #155724; }
        .stats { display: flex; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap; }
        .stat { padding: 0.5rem 1rem; background: var(--pico-card-background-color); border-radius: 4px; }
    </style>
</head>
<body>
    <header class="container">
        <nav>
            <ul><li><strong><a href="/">Callobuzz Scraper</a></strong></li></ul>
            {% block nav_right %}<ul><li><a href="/logout" onclick="sessionStorage.removeItem('scraperApiKey')">Sign out</a></li></ul>{% endblock %}
        </nav>
    </header>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
