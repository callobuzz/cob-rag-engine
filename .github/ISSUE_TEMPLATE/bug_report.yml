name: Bug report
description: Something does not work as the documentation says
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not report a security problem here. Follow SECURITY.md instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to see it
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The "version" field of GET /api/v1/info, or the top of CHANGELOG.md.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log lines
      description: "The last lines of the log. Remove keys, passwords and personal data first."
      render: text
