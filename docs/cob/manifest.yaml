# COB's documentation: which files make up its knowledge base and the in-app Docs, and who may
# read each page. One manifest feeds both, so the two can never disagree.
#
# audience = the least privileged role that may read the page: public (anyone, also the
# sign-in pages), customer (a signed-in workspace) or admin (the platform operator).
# `sections:` overrides the audience or topic of one section by its anchor; a name that matches
# no section fails the build, so a renamed heading cannot silently expose admin text.
# Inside a Markdown page, a heading followed by `<!-- audience: admin -->` makes that section
# admin-only.
version: 1
topics:
  - {id: getting-started, title: "Getting started"}
  - {id: knowledge-bases, title: "Knowledge bases & uploads"}
  - {id: assistant, title: "Assistant"}
  - {id: widget, title: "Website widget"}
  - {id: agents, title: "Agents & MCP"}
  - {id: keys, title: "Keys & permissions"}
  - {id: plans, title: "Plans, usage & costs"}
  - {id: quality, title: "Evaluation & quality"}
  - {id: benchmarks, title: "Benchmarks"}
  - {id: api, title: "API reference"}
  - {id: settings, title: "Settings reference", audience: admin}
  - {id: operations, title: "Deploy & operations", audience: admin}
  - {id: changelog, title: "Changelog"}
  - {id: screens, title: "Screens"}
sources:
  - id: why
    path: docs/cob/pages/why-cob-rag-engine.md
    kind: markdown
    split: page
    slug: why-cob-rag-engine
    topic: getting-started
    audience: public
  # BIZ5
