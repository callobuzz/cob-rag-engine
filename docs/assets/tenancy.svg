<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-labelledby="t d" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, -apple-system, sans-serif">
  <title id="t">Multi-tenant model</title>
  <desc id="d">One engine holds many tenants. Each tenant owns corpora; each corpus can have widget keys for websites. Every level has its own key and is metered.</desc>
  <rect width="1000" height="330" rx="20" fill="#f8fafc"/>
  <g stroke="#94a3b8" stroke-width="2" fill="none">
    <path d="M160 150 C 210 150, 210 90, 262 90"/><path d="M160 150 C 210 150, 210 230, 262 230"/>
    <path d="M462 90 C 510 90, 510 60, 560 60"/><path d="M462 90 C 510 90, 510 120, 560 120"/><path d="M462 230 C 510 230, 510 230, 560 230"/>
    <path d="M760 60 C 800 60, 800 60, 830 60"/><path d="M760 120 C 800 120, 800 120, 830 120"/><path d="M760 230 C 800 230, 800 205, 830 205"/><path d="M760 230 C 800 230, 800 260, 830 260"/>
  </g>
  <rect x="32" y="108" width="128" height="84" rx="14" fill="#0f172a"/>
  <text x="96" y="142" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">Engine</text>
  <text x="96" y="164" text-anchor="middle" font-size="11.5" fill="#cbd5e1">admin key</text>
  <g font-size="13.5" font-weight="700" fill="#0f172a">
    <rect x="262" y="62" width="200" height="56" rx="12" fill="#fff" stroke="#c7d2fe"/><text x="280" y="86">Tenant · Acme Inc</text><text x="280" y="105" font-size="11.5" font-weight="500" fill="#4f46e5">tk_ key · usage · suspend</text>
    <rect x="262" y="202" width="200" height="56" rx="12" fill="#fff" stroke="#c7d2fe"/><text x="280" y="226">Tenant · Bright Dental</text><text x="280" y="245" font-size="11.5" font-weight="500" fill="#4f46e5">tk_ key · usage · suspend</text>
    <rect x="560" y="36" width="200" height="48" rx="12" fill="#fff" stroke="#a7f3d0"/><text x="576" y="57">Corpus · Help center</text><text x="576" y="74" font-size="11" font-weight="500" fill="#0f766e">ck_ · own model &amp; prompt</text>
    <rect x="560" y="96" width="200" height="48" rx="12" fill="#fff" stroke="#a7f3d0"/><text x="576" y="117">Corpus · Internal HR</text><text x="576" y="134" font-size="11" font-weight="500" fill="#0f766e">ck_ · own vectors</text>
    <rect x="560" y="206" width="200" height="48" rx="12" fill="#fff" stroke="#a7f3d0"/><text x="576" y="227">Corpus · Patient FAQ</text><text x="576" y="244" font-size="11" font-weight="500" fill="#0f766e">ck_ · BYO LLM key</text>
  </g>
  <g font-size="12.5" font-weight="600" fill="#0f172a">
    <rect x="830" y="40" width="140" height="40" rx="10" fill="#fffbeb" stroke="#fde68a"/><text x="846" y="65">pk_ acme.com</text>
    <rect x="830" y="100" width="140" height="40" rx="10" fill="#f1f5f9" stroke="#e2e8f0"/><text x="846" y="125" fill="#64748b">API only</text>
    <rect x="830" y="185" width="140" height="40" rx="10" fill="#fffbeb" stroke="#fde68a"/><text x="846" y="210">pk_ brightdental</text>
    <rect x="830" y="240" width="140" height="40" rx="10" fill="#fffbeb" stroke="#fde68a"/><text x="846" y="265">pk_ booking-app</text>
