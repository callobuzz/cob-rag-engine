[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cob-rag-client"
version = "0.2.0"
description = "Python client for cob-rag-engine — the self-hosted multi-tenant RAG engine"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Callobuzz", email = "callobuzz@gmail.com" }]
keywords = ["rag", "chatbot", "llm", "client", "cob-rag-engine"]
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/callobuzz/cob-rag-engine/tree/main/clients/python#readme"
Repository = "https://github.com/callobuzz/cob-rag-engine"
Issues = "https://github.com/callobuzz/cob-rag-engine/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.hatch.build.targets.wheel]
packages = ["cob_rag_client"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
